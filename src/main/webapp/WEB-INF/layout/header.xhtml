<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:faces="jakarta.faces"
                xmlns:ui="jakarta.faces.facelets">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">
            <a faces:outcome="/index.xhtml" class="navbar-brand">
                <i class="bi bi-shield-lock me-2"></i>Jakarta EE Security Example
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
                    aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarCollapse">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item">
                        <a faces:outcome="/index.xhtml"
                           class="nav-link #{facesContext.viewRoot.viewId.contains('/index') ? 'active' : ''}">
                            <i class="bi bi-house-door me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a faces:outcome="/profile.xhtml"
                           class="nav-link #{request.requestURI.contains('/profile') ? 'active' : ''}">
                            <i class="bi bi-person me-1"></i>Profile
                        </a>
                    </li>
                    <ui:fragment rendered="#{authBean.admin}">
                        <li class="nav-item">
                            <a faces:outcome="/users/index.xhtml"
                               class="nav-link #{request.requestURI.contains('/users') ? 'active' : ''}">
                                <i class="bi bi-people me-1"></i>Users Management
                            </a>
                        </li>
                    </ui:fragment>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <ui:fragment rendered="#{authBean.authenticated}">
                        <li class="nav-item">
                            <form faces:id="logoutForm" class="d-inline">
                                <a faces:action="#{authBean.logout}" class="btn btn-danger">
                                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                                </a>
                            </form>
                        </li>
                    </ui:fragment>
                </ul>
            </div>
        </div>
    </nav>
</ui:composition>
