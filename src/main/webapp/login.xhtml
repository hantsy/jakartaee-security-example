<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:faces="jakarta.faces"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<f:view contentType="text/html" encoding="UTF-8">
    <head faces:id="head">
        <title>Login | Security</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
        <link href="#{resource['css/main.css']}" rel="stylesheet"/>
    </head>
    <body faces:id="body">
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-md-5 col-lg-4">
                    <div class="card border-0 shadow-lg">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <i class="bi bi-shield-lock fs-1 text-primary"></i>
                                <h1 class="h4 fw-bold mt-2 mb-1">Security</h1>
                                <p class="text-muted small mb-0">Sign in to continue</p>
                            </div>

                            <div faces:id="errorAlert"
                                 faces:rendered="#{not empty param.error}"
                                 class="alert alert-danger alert-dismissible fade show d-flex align-items-center"
                                 role="alert">

                                <!-- Bootstrap Font Icon -->
                                <i class="bi bi-exclamation-triangle-fill me-2" style="font-size: 1.2rem;"></i>

                                <div>
                                    <strong>Login Failed:</strong> #{param.error}
                                </div>

                                <!-- Bootstrap Dismiss Button -->
                                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                            </div>


                            <form faces:id="form">
                                <div class="mb-3">
                                    <label class="form-label" faces:for="username">Username</label>
                                    <input type="text" faces:id="username" faces:value="#{loginBean.username}"
                                           class="form-control" placeholder="Enter your username"/>
                                    <h:message for="username" styleClass="text-danger"/>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" faces:for="password">Password</label>
                                    <input type="password" faces:id="password" faces:value="#{loginBean.password}"
                                           class="form-control" placeholder="Enter your password"/>
                                    <h:message for="password" styleClass="text-danger"/>
                                </div>
                                <button faces:id="login" type="submit" faces:action="#{loginBean.login}"
                                        class="btn btn-primary btn-lg w-100 justify-content-center">
                                    <i class="bi bi-box-arrow-in-right me-1"></i>Login
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</f:view>
</html>
