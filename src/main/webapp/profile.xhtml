<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/layout/template.xhtml">
    <ui:define name="metadata">
        <f:metadata>
            <f:viewAction action="#{profileBean.init()}"/>
        </f:metadata>
    </ui:define>
    <ui:define name="pageTitle">Profile</ui:define>
    <ui:define name="content">
        <div class="detail-card">
            <div class="detail-row">
                <div class="detail-label">Principal Name</div>
                <div class="detail-value">#{profileBean.name}</div>
            </div>
            <div class="detail-row">
                <div class="detail-label">Roles</div>
                <div class="detail-value">
                    <ui:repeat var="r" value="#{profileBean.roles}">
                        <span class="role-badge">#{r}</span>
                    </ui:repeat>
                </div>
            </div>
        </div>
    </ui:define>
</ui:composition>
