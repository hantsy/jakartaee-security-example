<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:faces="jakarta.faces"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/layout/template.xhtml">
    <ui:define name="pageTitle">User Details</ui:define>
    <ui:define name="content">
        <table class="table table-bordered">
            <tbody>
                <tr><th scope="row">ID</th><td>#{userDetailsBean.user.id}</td></tr>
                <tr><th scope="row">Username</th><td>#{userDetailsBean.user.username}</td></tr>
                <tr><th scope="row">Email</th><td>#{userDetailsBean.user.email}</td></tr>
                <tr>
                    <th scope="row">Roles</th>
                    <td>
                        <ui:repeat var="r" value="#{userDetailsBean.user.roles}">
                            <span class="role-badge">#{r}</span>
                        </ui:repeat>
                    </td>
                </tr>
                <tr><th scope="row">Status</th><td>#{userDetailsBean.user.enabled}</td></tr>
                <tr><th scope="row">Created At</th><td>#{userDetailsBean.user.createdAt}</td></tr>
                <tr><th scope="row">Updated At</th><td>#{userDetailsBean.user.updatedAt}</td></tr>
            </tbody>
        </table>

        <form faces:id="actions">
            <button faces:id="toggle" type="submit" faces:action="#{userDetailsBean.toggleEnabled}" class="btn btn-warning">
                #{userDetailsBean.user.enabled ? 'Disable' : 'Enable'}
            </button>
            <button faces:id="delete" type="submit" faces:action="#{userDetailsBean.delete}" class="btn btn-danger ms-2"
                    onclick="return confirm('Delete this user?');">
                Delete
            </button>
        </form>
    </ui:define>
</ui:composition>
