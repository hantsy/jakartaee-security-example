<!DOCTYPE html>
<html lang="en"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>User Details</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</h:head>
<h:body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>User Details</h1>
            <h:link outcome="/users" styleClass="btn btn-outline-secondary">
                <h:outputText styleClass="bi bi-arrow-left me-1"/>
                <h:outputText value="Back"/>
            </h:link>
        </div>

        <table class="table table-bordered">
            <tbody>
                <tr><th scope="row">ID</th><td>#{userDetailsBean.user.id}</td></tr>
                <tr><th scope="row">Username</th><td>#{userDetailsBean.user.username}</td></tr>
                <tr><th scope="row">Email</th><td>#{userDetailsBean.user.email}</td></tr>
                <tr><th scope="row">Role</th><td>#{userDetailsBean.user.role}</td></tr>
                <tr><th scope="row">Status</th><td>#{userDetailsBean.user.enabled}</td></tr>
                <tr><th scope="row">Created At</th><td>#{userDetailsBean.user.createdAt}</td></tr>
                <tr><th scope="row">Updated At</th><td>#{userDetailsBean.user.updatedAt}</td></tr>
            </tbody>
        </table>

        <h:form id="actions">
            <h:commandButton id="toggle" value="#{userDetailsBean.user.enabled ? 'Disable' : 'Enable'}"
                             action="#{userDetailsBean.toggleEnabled}" styleClass="btn btn-warning"/>
            <h:commandButton id="delete" value="Delete" action="#{userDetailsBean.delete}"
                             styleClass="btn btn-danger ms-2"
                             onclick="return confirm('Delete this user?');"/>
        </h:form>
    </div>
</h:body>
</html>
