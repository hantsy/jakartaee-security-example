<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:faces="jakarta.faces"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/layout/template.xhtml">
    <ui:define name="pageTitle">Users</ui:define>
    <ui:define name="content">
        <div class="d-flex justify-content-end mb-3">
            <a faces:outcome="/users/new" class="btn btn-primary">
                <i class="bi bi-person-plus me-1"></i>Add User
            </a>
        </div>

        <div class="table-card">
            <table class="table table-striped table-hover align-middle">
                <thead>
                    <tr>
                        <th>Username</th>
                        <th>Email</th>
                        <th>Roles</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <ui:repeat var="user" value="#{usersBean.users}">
                        <tr>
                            <td>#{user.username}</td>
                            <td>#{user.email}</td>
                            <td>
                                <ui:repeat var="r" value="#{user.roles}">
                                    <span class="role-badge">#{r}</span>
                                </ui:repeat>
                            </td>
                            <td>
                                <span class="badge bg-success" faces:rendered="#{user.enabled}">Enabled</span>
                                <span class="badge bg-secondary" faces:rendered="#{not user.enabled}">Disabled</span>
                            </td>
                            <td>
                                <a faces:outcome="/users/#{user.id}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-eye me-1"></i>Details
                                </a>
                            </td>
                        </tr>
                    </ui:repeat>
                </tbody>
            </table>
        </div>
    </ui:define>
</ui:composition>
