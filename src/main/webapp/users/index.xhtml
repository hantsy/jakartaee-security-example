<!DOCTYPE html>
<html lang="en"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Users</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</h:head>
<h:body>
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Users</h1>
            <h:link outcome="/users/new" styleClass="btn btn-primary">
                <h:outputText styleClass="bi bi-person-plus me-1"/>
                <h:outputText value="Add User"/>
            </h:link>
        </div>

        <h:dataTable value="#{usersBean.users}" var="user"
                     styleClass="table table-striped table-hover align-middle"
                     headerClass="table-light">
            <h:column>
                <f:facet name="header">Username</f:facet>
                #{user.username}
            </h:column>
            <h:column>
                <f:facet name="header">Email</f:facet>
                #{user.email}
            </h:column>
            <h:column>
                <f:facet name="header">Role</f:facet>
                #{user.role}
            </h:column>
            <h:column>
                <f:facet name="header">Status</f:facet>
                <h:outputText value="Enabled" rendered="#{user.enabled}" styleClass="badge bg-success"/>
                <h:outputText value="Disabled" rendered="#{not user.enabled}" styleClass="badge bg-secondary"/>
            </h:column>
            <h:column>
                <f:facet name="header">Actions</f:facet>
                <h:link outcome="/users/#{user.id}" styleClass="btn btn-sm btn-outline-primary">
                    <h:outputText styleClass="bi bi-eye me-1"/>
                    <h:outputText value="Details"/>
                </h:link>
            </h:column>
        </h:dataTable>
    </div>
</h:body>
</html>
