<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:faces="jakarta.faces"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                xmlns:h="jakarta.faces.html"
                template="/WEB-INF/layout/template.xhtml">
    <ui:define name="pageTitle">Add User</ui:define>
    <ui:define name="content">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <div faces:rendered="#{not empty createUserBean.generatedPassword}" class="alert alert-success">
                    Generated password: <strong>#{createUserBean.generatedPassword}</strong>
                </div>

                <form faces:id="form">
                    <div class="row mb-3 align-items-center">
                        <label class="col-sm-3 col-form-label" faces:for="username">Username</label>
                        <div class="col-sm-9">
                            <input type="text" faces:id="username" faces:value="#{createUserBean.username}" class="form-control"/>
                            <h:message for="username" styleClass="text-danger"/>
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label class="col-sm-3 col-form-label" faces:for="email">Email</label>
                        <div class="col-sm-9">
                            <input type="text" faces:id="email" faces:value="#{createUserBean.email}" class="form-control"/>
                            <h:message for="email" styleClass="text-danger"/>
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label class="col-sm-3 col-form-label">Roles</label>
                        <div class="col-sm-9">
                            <h:selectManyCheckbox id="roles" value="#{createUserBean.roles}" layout="list" styleClass="role-select">
                                <f:selectItems value="#{createUserBean.allRoles}" var="r" itemLabel="#{r}" itemValue="#{r}"/>
                            </h:selectManyCheckbox>
                            <h:message for="roles" styleClass="text-danger"/>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button faces:id="create" type="submit" faces:action="#{createUserBean.create}" class="btn btn-primary">
                            <i class="bi bi-save"></i>Create User
                        </button>
                        <a faces:outcome="/users/list.xhtml" class="btn btn-outline-secondary ms-auto">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </ui:define>
</ui:composition>
