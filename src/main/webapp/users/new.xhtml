<!DOCTYPE html>
<html lang="en"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
<h:head>
    <title>Add User</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
</h:head>
<h:body>
    <div class="container py-4">
        <h1>Add User</h1>

        <h:panelGroup layout="block" rendered="#{not empty createUserBean.generatedPassword}" styleClass="alert alert-success">
            Generated password: <strong>#{createUserBean.generatedPassword}</strong>
        </h:panelGroup>

        <h:form id="form" styleClass="row g-3">
            <div class="col-md-6">
                <h:outputLabel for="username" value="Username" styleClass="form-label"/>
                <h:inputText id="username" value="#{createUserBean.username}" styleClass="form-control"/>
                <h:message for="username" styleClass="text-danger"/>
            </div>
            <div class="col-md-6">
                <h:outputLabel for="email" value="Email" styleClass="form-label"/>
                <h:inputText id="email" value="#{createUserBean.email}" styleClass="form-control"/>
                <h:message for="email" styleClass="text-danger"/>
            </div>
            <div class="col-md-6">
                <h:outputLabel for="role" value="Role" styleClass="form-label"/>
                <h:selectOneMenu id="role" value="#{createUserBean.role}" styleClass="form-select">
                    <f:selectItems value="#{createUserBean.roles}" var="r" itemLabel="#{r}" itemValue="#{r}"/>
                </h:selectOneMenu>
            </div>
            <div class="col-12">
                <h:commandButton id="create" value="Create User" action="#{createUserBean.create}" styleClass="btn btn-primary"/>
                <h:link outcome="/users" styleClass="btn btn-outline-secondary ms-2">Cancel</h:link>
            </div>
        </h:form>
    </div>
</h:body>
</html>
